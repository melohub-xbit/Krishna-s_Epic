<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="VKS">
  <!--
    The tab mark: the helmet from the sign-off, reduced to what sixteen
    pixels can hold. One cream silhouette, one vermilion visor, the
    initials knocked out of it, and the glint that makes the visor read
    as glass rather than as a dot.

    The letters are drawn as paths, not set as type. A favicon renders
    with no web fonts loaded, so a text element here would fall back to
    whatever the OS hands it and the mark would change shape per machine.

    Same three colours as the rest of the site: the plate, the cream and
    the accent. apple-icon.png is this without the corner radius, because
    iOS applies its own mask and rounding it twice leaves a pale fringe.

    Note for future edits: no double hyphens anywhere in this comment.
    They are illegal inside an XML comment, the whole file then fails to
    parse, and a browser answers an unparseable favicon with the generic
    globe rather than with an error.
  -->
  <rect width="64" height="64" rx="14" fill="#0B1220"/>
  <rect x="5" y="14" width="10" height="22" rx="4.6" fill="#E8DCC7"/>
  <rect x="49" y="14" width="10" height="22" rx="4.6" fill="#E8DCC7"/>
  <rect x="9" y="7" width="46" height="46" rx="18" fill="#E8DCC7"/>
  <circle cx="32" cy="29.5" r="15.4" fill="#C75340"/>
  <g fill="none" stroke="#0B1220" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21.6 24.4 24.7 34.6 27.8 24.4"/>
    <path d="M31.2 24.2V34.6"/>
    <path d="M31.2 29.4 35.4 24.2"/>
    <path d="M31.2 29.4 35.9 34.6"/>
    <path d="M43.2 25.4c0-1.8-4.4-2.1-4.4.4 0 2.5 4.6 2.6 4.6 5.4 0 2.6-4.4 2.5-4.7.5"/>
  </g>
  <ellipse cx="23.6" cy="20.4" rx="4.2" ry="2.4" transform="rotate(-32 23.6 20.4)" fill="#E8DCC7" opacity="0.5"/>
</svg>
