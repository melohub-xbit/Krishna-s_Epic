<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="K">
  <!-- The tab mark. Same three colours as the site: the near-black plate,
       the off-white type, and one accent dot where the arms meet — which
       is the whole site in miniature. Vector so it stays crisp in a
       high-DPI tab strip; apple-icon.png is the raster for iOS. -->
  <rect width="32" height="32" rx="7" fill="#0a0a0b"/>
  <g fill="none" stroke="#f2efea" stroke-width="2.9" stroke-linecap="round">
    <path d="M11.4 6.6 V25.4"/>
    <path d="M11.4 16 22.2 6.6"/>
    <path d="M11.4 16 22.6 25.4"/>
  </g>
  <circle cx="11.4" cy="16" r="2.35" fill="#ff2d55"/>
</svg>
